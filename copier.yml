# template-container: a feature overlay for a project that ships a container image. It goes
# on top of template-base and a code stack overlay (template-python or template-typescript),
# whose answers it reads (it never asks their questions again):
#
#   uvx copier copy --trust gh:andronics/template-base my-project
#   uvx copier copy --trust gh:andronics/template-python my-project      # container_image: true
#   uvx copier copy --trust gh:andronics/template-container my-project
#
# The stack owns the Dockerfile (it is language-specific) and its `contrib` answer; this adds
# the image's build and cleanup workflows (container-*) and the docker and k8s manifests the
# stack's `contrib` names. A feature overlay fills no slot and adds no required check
# (template-base decision 0001; this repository's docs/decisions/0001).

_min_copier_version: "9.19.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.container.yml
# The stacks this overlay supports; exactly one must be applied. A missing file reads as {}.
_external_data:
  base: .copier-answers.base.yml
  python: .copier-answers.stack-python.yml
  typescript: .copier-answers.stack-typescript.yml

# GitHub Actions uses ${{ }}, so Jinja uses [[ ]] / [% %] instead.
_envops:
  variable_start_string: "[["
  variable_end_string: "]]"
  block_start_string: "[%"
  block_end_string: "%]"
  comment_start_string: "[#!"
  comment_end_string: "!#]"
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

_message_after_copy: |
  [[ project_name ]] builds [[ image ]]: container-build.yml on pushes, PRs and each release.
  Next: git add -A && git commit -m "chore: add template-container"

_message_after_update: |
  Next: resolve any <<<<<<< markers, run sh scripts/post-update.sh, review git diff and commit.

# ------------------------------- from base and the stack (read, never asked)

# `copier update` replays each version in an empty directory, without the other templates'
# answers files, so what this overlay reads from them is recorded in its own answers file
# (template-base decision 0001, "Overlays keep a copy of base's answers"). ask: false never
# prompts; each validator rejects a recorded copy that differs from the file it came from, so
# Copier rereads the file and the next replay gets the new one.
base_answers:
  type: yaml
  ask: false
  default: "[[ dict(_external_data.base | items | rejectattr('0', 'in', ['_commit', '_src_path'])) | tojson ]]"
  validator: >-
    [% if _external_data.base and base_answers != dict(_external_data.base | items
       | rejectattr('0', 'in', ['_commit', '_src_path'])) %]stale: reread .copier-answers.base.yml[% endif %]

# The stack overlay: the supported stacks with an answers file, comma-joined (exactly one is
# allowed; compat_check says so).
stack:
  type: str
  ask: false
  default: >-
    [%- set found = [] -%]
    [%- for name in ['python', 'typescript'] -%]
    [%- if _external_data[name] -%][%- set _ = found.append(name) -%][%- endif -%]
    [%- endfor -%]
    [[ found | join(',') ]]
  validator: >-
    [%- set found = [] -%]
    [%- for name in ['python', 'typescript'] -%]
    [%- if _external_data[name] -%][%- set _ = found.append(name) -%][%- endif -%]
    [%- endfor -%]
    [% if found and stack != found | join(',') %]stale: reread the stack's answers file[% endif %]

stack_answers:
  type: yaml
  ask: false
  default: "[[ (dict(_external_data[stack] | items | rejectattr('0', 'in', ['_commit', '_src_path', 'base_answers'])) if stack and ',' not in stack else {}) | tojson ]]"
  validator: >-
    [% if stack and ',' not in stack and _external_data[stack] and stack_answers != dict(_external_data[stack] | items
       | rejectattr('0', 'in', ['_commit', '_src_path', 'base_answers'])) %]stale: reread the stack's answers file[% endif %]

# Fails the copy or update, with the reason, unless base (v2.0.0 or later) and one supported stack
# (v1.0.0 or later) are applied and the stack answered container_image: true. A replay has no
# answers files, only the recorded copies; the real render beside it reads the files, so the
# check runs there.
compat_check:
  type: str
  when: false
  default: >-
    [%- set re = '^v?(\\d+)\\.(\\d+)\\.(\\d+)' -%]
    [%- set b = _external_data.base._commit | default('') | string -%]
    [%- set bv = b | regex_search(re, '\\1', '\\2', '\\3') -%]
    [%- set c = (_external_data[stack]._commit | default('') | string) if stack and ',' not in stack else '' -%]
    [%- set cv = c | regex_search(re, '\\1', '\\2', '\\3') -%]
    [%- if not b and base_answers | default({}) -%]ok
    [%- elif not b -%][[ {}['template-container needs template-base first: .copier-answers.base.yml is missing'].stop ]]
    [%- elif not bv or (bv | map('int') | list) < [2, 0, 0] -%][[ {}['template-container needs template-base v2.0.0 or later; this project has ' ~ b].stop ]]
    [%- elif ',' in stack -%][[ {}['template-container found more than one stack overlay: ' ~ stack].stop ]]
    [%- elif not stack -%][[ {}['template-container needs a stack overlay first: template-python or template-typescript'].stop ]]
    [%- elif not cv or (cv | map('int') | list) < [1, 0, 0] -%][[ {}['template-container needs template-' ~ stack ~ ' v1.0.0 or later; this project has ' ~ c].stop ]]
    [%- elif not (stack_answers.container_image | default(false)) -%][[ {}['template-container needs the stack answer container_image: true (template-' ~ stack ~ ')'].stop ]]
    [%- else -%]ok[%- endif -%]

# The stack's answers this overlay renders from.
s:
  type: yaml
  when: false
  default: "[[ stack_answers | tojson ]]"

project_name:
  type: str
  default: "[[ base_answers.project_name ]]"
  when: false

github_owner:
  type: str
  default: "[[ base_answers.github_owner ]]"
  when: false

# Base's owner_is_org (v2.0.8 and later). Before it, base's own rule: code_owners naming
# @owner means a personal account. container-cleanup.yml's `account` needs it (decision 0002).
owner_is_org:
  type: bool
  default: >-
    [[ base_answers.owner_is_org if base_answers.owner_is_org is defined
       else ('@' ~ github_owner | lower) not in (base_answers.code_owners | default('') | lower).split() ]]
  when: false

kind:
  type: str
  default: "[[ s.kind ]]"
  when: false

port:
  type: int
  default: "[[ s.port | default(8080) ]]"
  when: false

extra_ports:
  type: yaml
  default: "[[ s.extra_ports | default([]) | tojson ]]"
  when: false

health_path:
  type: str
  default: "[[ s.health_path | default('/healthz') ]]"
  when: false

timezone:
  type: str
  default: "[[ s.timezone | default('Europe/London') ]]"
  when: false

puid_pgid:
  type: bool
  default: "[[ s.puid_pgid | default(false) ]]"
  when: false

contrib:
  type: yaml
  default: "[[ s.contrib | default([]) | tojson ]]"
  when: false

# Python's settings prefix comes from its package name; TypeScript's from the project name.
env_prefix:
  type: str
  default: "[[ (s.package_name | default(project_name | replace('-', '_'))) | upper ]]_"
  when: false

image:
  type: str
  default: "ghcr.io/[[ github_owner ]]/[[ project_name ]]"
  when: false

# ---------------------------------------------------------------- questions

multi_arch:
  type: bool
  help: Build linux/arm64 as well as linux/amd64?
  default: true
